name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src api tests || true

      - name: Export static site data
        run: python -m osd.cli export-static

      - name: Unit tests (no database required for core)
        run: pytest tests/test_scoring.py tests/test_normalisation.py tests/test_uncertainty.py tests/test_weighting.py tests/test_provenance.py tests/test_urf.py -q

  frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .
      - run: python -m osd.cli export-static

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build static dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

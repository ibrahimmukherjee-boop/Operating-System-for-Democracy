name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: osd
          POSTGRES_PASSWORD: osd
          POSTGRES_DB: osd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src api tests

      - name: Seed database
        env:
          DATABASE_URL: postgresql://osd:osd@localhost:5432/osd
        run: python -m osd.cli seed

      - name: Run tests
        env:
          DATABASE_URL: postgresql://osd:osd@localhost:5432/osd
        run: pytest --cov=osd --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install and build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

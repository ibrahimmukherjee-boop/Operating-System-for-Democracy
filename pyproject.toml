[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operating-system-for-democracy"
version = "0.1.0"
description = "Transparent, auditable framework for evaluating governments and policies against societal objectives"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Operating System for a Democracy Contributors" }]
keywords = ["democracy", "policy", "governance", "audit", "open-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pandas>=2.2.0",
    "polars>=1.12.0",
    "duckdb>=1.1.0",
    "httpx>=0.28.0",
    "python-dateutil>=2.9.0",
    "alembic>=1.14.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[project.scripts]
osd-api = "api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/osd", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
